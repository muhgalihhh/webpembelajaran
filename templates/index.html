<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Preview & PDF Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <!-- Header -->
        <div class="row bg-primary text-white p-3">
            <div class="col">
                <h1><i class="fas fa-file-excel"></i> Excel Preview & PDF Converter</h1>
                <p class="mb-0">Preview Excel dengan format asli dan konversi ke PDF</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="row">
            <!-- Left Panel - Controls -->
            <div class="col-md-3 bg-light p-3">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-upload"></i> Upload File</h5>
                    </div>
                    <div class="card-body">
                        <form id="uploadForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="excelFile" class="form-label">Pilih File Excel</label>
                                <input type="file" class="form-control" id="excelFile" name="file" accept=".xlsx,.xls" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-upload"></i> Upload & Load
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Sheet Selection -->
                <div class="card mt-3" id="sheetCard" style="display: none;">
                    <div class="card-header">
                        <h5><i class="fas fa-layer-group"></i> Pilih Sheet</h5>
                    </div>
                    <div class="card-body">
                        <select class="form-select" id="sheetSelect">
                            <option value="">Loading sheets...</option>
                        </select>
                    </div>
                </div>

                <!-- Cell Range -->
                <div class="card mt-3" id="rangeCard" style="display: none;">
                    <div class="card-header">
                        <h5><i class="fas fa-border-all"></i> Cell Range</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="cellRange" class="form-label">Range Cell</label>
                            <input type="text" class="form-control" id="cellRange" placeholder="A1:Z50" value="A1:Z50">
                        </div>
                        <button type="button" class="btn btn-outline-primary w-100" id="loadRangeBtn">
                            <i class="fas fa-eye"></i> Load Range
                        </button>
                    </div>
                </div>

                <!-- PDF Settings -->
                <div class="card mt-3" id="pdfCard" style="display: none;">
                    <div class="card-header">
                        <h5><i class="fas fa-file-pdf"></i> PDF Settings</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="pageSize" class="form-label">Ukuran Kertas</label>
                            <select class="form-select" id="pageSize">
                                <option value="A4">A4</option>
                                <option value="A3">A3</option>
                                <option value="Letter">Letter</option>
                                <option value="Legal">Legal</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="orientation" class="form-label">Orientasi</label>
                            <select class="form-select" id="orientation">
                                <option value="Portrait">Portrait</option>
                                <option value="Landscape">Landscape</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-success w-100" id="convertBtn">
                            <i class="fas fa-file-pdf"></i> Convert to PDF
                        </button>
                    </div>
                </div>

                <!-- Status -->
                <div class="card mt-3">
                    <div class="card-header">
                        <h5><i class="fas fa-info-circle"></i> Status</h5>
                    </div>
                    <div class="card-body">
                        <div id="statusText">Ready</div>
                        <div id="progressBar" class="progress mt-2" style="display: none;">
                            <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Excel Preview -->
            <div class="col-md-9 p-3">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5><i class="fas fa-table"></i> Excel Preview</h5>
                        <div>
                            <button class="btn btn-sm btn-outline-secondary" id="zoomInBtn">
                                <i class="fas fa-search-plus"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" id="zoomOutBtn">
                                <i class="fas fa-search-minus"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" id="resetZoomBtn">
                                <i class="fas fa-expand-arrows-alt"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="excelContainer" class="excel-container">
                            <div id="excelTable" class="excel-table">
                                <div class="text-center text-muted py-5">
                                    <i class="fas fa-file-excel fa-3x mb-3"></i>
                                    <p>Upload file Excel untuk melihat preview</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Modal -->
    <div class="modal fade" id="loadingModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2" id="loadingText">Processing...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Success!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="successMessage"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <a href="#" class="btn btn-primary" id="downloadLink">
                        <i class="fas fa-download"></i> Download PDF
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
